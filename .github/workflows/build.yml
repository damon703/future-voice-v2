name: Build APK V2
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo-dev cmake libffi-dev libssl-dev

      - name: Install python & buildozer
        run: |
          pip3 install buildozer

      - name: Accept SDK licenses
        run: yes | ~/.buildozer/android/platform/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-v2
          path: bin/*.apk
